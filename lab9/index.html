<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('signup')">Signup</button>
            <button class="tab-btn" onclick="openTab('login')">Login</button>
        </div>

        <form id="signup-form" class="tab-content active">
            <h2>Create an account</h2>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="firstName" placeholder="Enter first name">
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lastName" placeholder="Enter last name">
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email">
                <small class="error-msg"></small>
            </div>
            <div class="form-group pass-wrapper">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password">
                <i class="fa-regular fa-eye toggle-password"></i>
                <small class="error-msg"></small>
            </div>
            <div class="form-group pass-wrapper">
                <label>Confirm Password</label>
                <input type="password" name="confirmPassword" placeholder="Confirm password">
                <i class="fa-regular fa-eye toggle-password"></i>
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="+380XXXXXXXXX">
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Date Birth</label>
                <input type="date" name="birthDate">
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Sex</label>
                <select name="sex">
                    <option value="">Select sex</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>Country</label>
                <select name="country" id="country-select">
                    <option value="">Select country</option>
                    <option value="ua">Ukraine</option>
                    <option value="pl">Poland</option>
                </select>
                <small class="error-msg"></small>
            </div>
            <div class="form-group">
                <label>City</label>
                <select name="city" id="city-select" disabled>
                    <option value="">Select city</option>
                </select>
                <small class="error-msg"></small>
            </div>
            <button type="submit" class="submit-btn">Signup</button>
        </form>

        <form id="login-form" class="tab-content">
            <h2>Login here</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username">
                <small class="error-msg"></small>
            </div>
            <div class="form-group pass-wrapper">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password">
                <i class="fa-regular fa-eye toggle-password"></i>
                <small class="error-msg"></small>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" name="rememberMe" id="remember">
                <label for="remember">Remember Me</label>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
